    <!-- route legend -->
    <g transform="translate(24 346)" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="12" font-weight="800">
      <rect width="1240" height="76" rx="8" fill="oklch(0.11 0 0)" stroke="oklch(0.26 0 0)"/>
      <circle cx="28" cy="27" r="6" fill="oklch(0.68 0.20 356.8)"/><text x="44" y="32" fill="oklch(0.91 0 0)">可编辑 4</text>
      <circle cx="150" cy="27" r="6" fill="oklch(0.66 0.17 255)"/><text x="166" y="32" fill="oklch(0.91 0 0)">纯图 3</text>
      <circle cx="255" cy="27" r="6" fill="oklch(0.88 0.19 130)"/><text x="271" y="32" fill="oklch(0.91 0 0)">混合 3</text>
      <circle cx="360" cy="27" r="6" fill="oklch(0.97 0 0)"/><text x="376" y="32" fill="oklch(0.91 0 0)">来源保留 2</text>
      <text x="28" y="58" fill="oklch(0.57 0 0)" letter-spacing="1.1">ALL PAGES ACCOUNTED FOR · NO ORPHAN MEDIA · NO ROUTE DRIFT</text>
    </g>
  </g>

  <!-- audit panel -->
  <g transform="translate(1400 220)" filter="url(#panelShadow)">
    <rect width="504" height="452" rx="14" fill="oklch(0.97 0 0)"/>
    <text x="28" y="49" fill="oklch(0.12 0 0)" font-family="Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="2">FINAL PPTX AUDIT</text>
    <text x="28" y="83" fill="oklch(0.48 0 0)" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="600">面向真实文件，而非预览截图</text>
    <path d="M28 108H476" stroke="oklch(0.82 0 0)"/>

    <g transform="translate(28 136)" font-family="Arial, 'Noto Sans SC', sans-serif">
      <g><circle cx="14" cy="14" r="14" fill="oklch(0.88 0.19 130)"/><path d="M8 14l4 4 8-10" fill="none" stroke="oklch(0.12 0 0)" stroke-width="3" stroke-linecap="round"/><text x="42" y="20" fill="oklch(0.12 0 0)" font-size="17" font-weight="900">内容与页面清单</text><text x="446" y="20" text-anchor="end" fill="oklch(0.47 0 0)" font-size="12" font-weight="800">PASS</text></g>
      <g transform="translate(0 55)"><circle cx="14" cy="14" r="14" fill="oklch(0.88 0.19 130)"/><path d="M8 14l4 4 8-10" fill="none" stroke="oklch(0.12 0 0)" stroke-width="3" stroke-linecap="round"/><text x="42" y="20" fill="oklch(0.12 0 0)" font-size="17" font-weight="900">字体与字号阶梯</text><text x="446" y="20" text-anchor="end" fill="oklch(0.47 0 0)" font-size="12" font-weight="800">PASS</text></g>
      <g transform="translate(0 110)"><circle cx="14" cy="14" r="14" fill="oklch(0.88 0.19 130)"/><path d="M8 14l4 4 8-10" fill="none" stroke="oklch(0.12 0 0)" stroke-width="3" stroke-linecap="round"/><text x="42" y="20" fill="oklch(0.12 0 0)" font-size="17" font-weight="900">背景与整册一致性</text><text x="446" y="20" text-anchor="end" fill="oklch(0.47 0 0)" font-size="12" font-weight="800">PASS</text></g>
      <g transform="translate(0 165)"><circle cx="14" cy="14" r="14" fill="oklch(0.88 0.19 130)"/><path d="M8 14l4 4 8-10" fill="none" stroke="oklch(0.12 0 0)" stroke-width="3" stroke-linecap="round"/><text x="42" y="20" fill="oklch(0.12 0 0)" font-size="17" font-weight="900">媒体与对象关系</text><text x="446" y="20" text-anchor="end" fill="oklch(0.47 0 0)" font-size="12" font-weight="800">PASS</text></g>
      <g transform="translate(0 220)"><circle cx="14" cy="14" r="14" fill="oklch(0.88 0.19 130)"/><path d="M8 14l4 4 8-10" fill="none" stroke="oklch(0.12 0 0)" stroke-width="3" stroke-linecap="round"/><text x="42" y="20" fill="oklch(0.12 0 0)" font-size="17" font-weight="900">页面路线完整性</text><text x="446" y="20" text-anchor="end" fill="oklch(0.47 0 0)" font-size="12" font-weight="800">PASS</text></g>
    </g>

    <rect x="28" y="404" width="448" height="26" rx="13" fill="oklch(0.12 0 0)"/>
    <rect x="28" y="404" width="448" height="26" rx="13" fill="oklch(0.88 0.19 130)"/>
    <text x="252" y="422" text-anchor="middle" fill="oklch(0.12 0 0)" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.6">VERIFIED FOR DELIVERY</text>
