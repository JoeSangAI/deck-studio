        <text x="92" y="63" fill="oklch(0.12 0 0)" font-family="Arial, sans-serif" font-size="13" font-weight="900">PASS</text>
        <text x="92" y="82" fill="oklch(0.55 0 0)" font-family="Arial, sans-serif" font-size="9" font-weight="800">FILE LEVEL</text>
      </g>
      <g transform="translate(1040)">
        <rect width="190" height="107" rx="5" fill="oklch(0.68 0.20 356.8)"/>
        <text x="14" y="25" fill="oklch(0.98 0 0)" font-family="Arial, sans-serif" font-size="9" font-weight="900">12 / END</text>
        <text x="14" y="67" fill="oklch(0.98 0 0)" font-family="Arial, sans-serif" font-size="22" font-weight="900">READY TO</text>
        <text x="14" y="91" fill="oklch(0.88 0.19 130)" font-family="Arial, sans-serif" font-size="22" font-weight="900">DELIVER.</text>
