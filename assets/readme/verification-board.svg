        <circle cx="46" cy="64" r="17" fill="oklch(0.68 0.20 356.8)"/>
        <rect x="94" y="40" width="73" height="7" fill="oklch(0.12 0 0)"/>
        <rect x="94" y="60" width="58" height="6" fill="oklch(0.68 0.20 356.8)"/>
        <rect x="94" y="79" width="68" height="6" fill="oklch(0.65 0 0)"/>
      </g>
      <g transform="translate(832)">
