        <circle cx="76" cy="67" r="9" fill="oklch(0.68 0.20 356.8)"/>
        <circle cx="118" cy="67" r="9" fill="oklch(0.66 0.17 255)"/>
        <circle cx="160" cy="67" r="9" fill="oklch(0.88 0.19 130)"/>
      </g>
      <g transform="translate(624)">
