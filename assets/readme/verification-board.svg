        <text x="14" y="25" fill="oklch(0.70 0 0)" font-family="Arial, sans-serif" font-size="9" font-weight="900">05 / QUOTE</text>
        <text x="14" y="64" fill="oklch(0.97 0 0)" font-family="Arial, sans-serif" font-size="29" font-weight="900">“ONE IDEA”</text>
        <rect x="14" y="82" width="62" height="4" fill="oklch(0.88 0.19 130)"/>
