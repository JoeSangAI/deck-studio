<svg xmlns="http://www.w3.org/2000/svg" width="1968" height="760" viewBox="0 0 1968 760" role="img" aria-labelledby="title desc">
  <title id="title">Deck Studio 最终 PPTX 验证</title>
  <desc id="desc">虚构的十二页演示文稿接触表与质量检查面板，展示内容、字体、背景、媒体和页面路线均已检查。</desc>
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="oklch(0.02 0 0)" flood-opacity="0.5"/>
    </filter>
    <pattern id="fineGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="oklch(0.25 0 0)" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1968" height="760" fill="oklch(0.09 0 0)"/>
  <rect width="1968" height="760" fill="url(#fineGrid)"/>
  <rect x="0" y="0" width="1968" height="10" fill="oklch(0.88 0.19 130)"/>

  <text x="64" y="72" fill="oklch(0.88 0.19 130)" font-family="Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3.2">FINAL-FILE QA · 94 REGRESSION CHECKS</text>
  <text x="64" y="132" fill="oklch(0.97 0 0)" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="49" font-weight="900">验收的对象，是最后那份 PPTX</text>
  <text x="64" y="174" fill="oklch(0.69 0 0)" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="21" font-weight="600">总览看整册节奏，脚本检查文件关系，必要时回到具体页面修正。</text>

  <!-- contact sheet -->
  <g transform="translate(64 220)" filter="url(#panelShadow)">
    <rect width="1292" height="452" rx="14" fill="oklch(0.15 0 0)" stroke="oklch(0.28 0 0)"/>
    <rect width="1292" height="48" rx="14" fill="oklch(0.20 0 0)"/>
    <rect y="34" width="1292" height="14" fill="oklch(0.20 0 0)"/>
    <circle cx="26" cy="24" r="6" fill="oklch(0.68 0.20 356.8)"/>
    <circle cx="48" cy="24" r="6" fill="oklch(0.88 0.19 130)"/>
    <text x="78" y="30" fill="oklch(0.72 0 0)" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.3">CONTACT SHEET / SYNTHETIC-DEMO.PPTX / 12 SLIDES</text>

    <!-- row 1 -->
    <g transform="translate(24 73)">
      <g>
        <rect width="190" height="107" rx="5" fill="oklch(0.68 0.20 356.8)"/>
        <text x="14" y="25" fill="oklch(0.98 0 0)" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="1">01 / COVER</text>
        <text x="14" y="64" fill="oklch(0.98 0 0)" font-family="Arial, sans-serif" font-size="25" font-weight="900">SIGNAL</text>
        <path d="M130 25h40M150 5v40" stroke="oklch(0.88 0.19 130)" stroke-width="6"/>
      </g>
      <g transform="translate(208)">
        <rect width="190" height="107" rx="5" fill="oklch(0.96 0 0)"/>
        <text x="14" y="25" fill="oklch(0.42 0 0)" font-family="Arial, sans-serif" font-size="9" font-weight="900">02 / EDITABLE</text>
        <rect x="14" y="40" width="88" height="8" fill="oklch(0.12 0 0)"/>
        <rect x="14" y="61" width="22" height="30" fill="oklch(0.68 0.20 356.8)"/>
        <rect x="44" y="49" width="22" height="42" fill="oklch(0.66 0.17 255)"/>
        <rect x="74" y="35" width="22" height="56" fill="oklch(0.88 0.19 130)"/>
        <text x="125" y="86" fill="oklch(0.12 0 0)" font-family="Arial, sans-serif" font-size="22" font-weight="900">42%</text>
